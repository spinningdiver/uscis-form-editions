name: 检查 USCIS 表格版本（手动后备）

# 每日检查已交给云端的 Claude 复核任务，这里不再定时运行。
#
# 原因：GitHub 的定时任务在高峰期会延迟几十分钟，极端情况下整次跳过。
# 两边各跑一次会互相撞车 —— 复核任务可能读到尚未更新的数据，
# 或与本工作流的提交产生冲突。全天只保留一个执行者，竞态就不存在。
#
# 本工作流保留为后备：云端任务出问题时，可在 Actions 页面手动触发，
# 拿到当天的数据（只是没有中文要点的复核与更新）。
on:
  workflow_dispatch:

permissions:
  contents: write # 提交更新后的数据与网页
  issues: write # 版本变化时开 Issue 通知

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取并生成网页
        run: python run.py --ci

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: 手动检查 $(date -u +%Y-%m-%d)"
          git push

      - name: 版本有变化时开 Issue 通知
        if: hashFiles('data/changes.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 标签可能尚未创建，--force 让这一步可重复执行
          gh label create "版本更新" --color D93F0B --force
          gh issue create \
            --title "$(head -1 data/changes.md)" \
            --body-file <(tail -n +2 data/changes.md) \
            --label "版本更新"
