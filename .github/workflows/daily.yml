name: 每日抓取 USCIS 表格版本

# 抓取由本工作流负责 —— 云端复核环境的出口策略禁止访问 www.uscis.gov，
# 只有 GitHub 的 runner 能拿到数据。
#
# 抓完推送后，push 事件会唤醒云端的 Claude 复核任务去读这批数据。
# 用事件触发而不是固定时间差：GitHub 的定时任务在高峰期会延迟几十分钟，
# 按时间约定必然产生竞态，按事件则永远是数据到位之后才开始复核。
on:
  schedule:
    # 13:00 UTC = 美东夏令时 09:00 / 冬令时 08:00
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write # 提交更新后的数据与网页
  issues: write # 版本变化时开 Issue 通知

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取并生成网页
        # --audit 额外导出全部未筛选的公告，供云端复核任务阅读
        run: python run.py --ci --audit

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: 每日抓取 $(date -u +%Y-%m-%d)"
          git push

      - name: 版本有变化时开 Issue 通知
        if: hashFiles('data/changes.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 标签可能尚未创建，--force 让这一步可重复执行
          gh label create "版本更新" --color D93F0B --force
          gh issue create \
            --title "$(head -1 data/changes.md)" \
            --body-file <(tail -n +2 data/changes.md) \
            --label "版本更新"
