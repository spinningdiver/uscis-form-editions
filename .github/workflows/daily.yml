name: 抓取 USCIS 表格版本

# 抓取必须在 GitHub runner 上跑 —— 云端 Claude 复核环境的出口策略
# 禁止访问 www.uscis.gov，只有这里拿得到数据。
#
# 正常情况下由云端的 Claude 复核任务通过 workflow_dispatch 触发：
# Claude 的定时器准时，dispatch 立即执行，避开了 GitHub 定时任务
# 在高峰期几十分钟的排队延迟（极端情况还会整次跳过）。
# Claude 触发后会等待本工作流结束，再拉取数据做复核，顺序确定。
#
# schedule 只作兜底：万一云端任务当天没跑起来，17:00 UTC 仍会抓一次。
# 兜底触发时若当天已经抓过，会直接跳过，不重复请求 USCIS。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *" # 美东 13:00，晚于 Claude 的正常触发时间

permissions:
  contents: write # 提交更新后的数据与网页
  issues: write # 版本变化时开 Issue 通知

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 兜底触发时，若当天已抓过则跳过
        id: guard
        if: github.event_name == 'schedule'
        run: |
          today=$(date -u +%Y-%m-%d)
          last=$(grep -o '"checked_at": "[^"]*"' data/last_checked.json | cut -d'"' -f4 | cut -c1-10)
          echo "上次抓取 $last，今天 $today"
          if [ "$last" = "$today" ]; then
            echo "今天已经抓过，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 抓取并生成网页
        if: steps.guard.outputs.skip != 'true'
        # --audit 额外导出全部未筛选的公告，供云端复核任务阅读
        run: python run.py --ci --audit

      - name: 提交结果
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: 抓取 $(date -u +%Y-%m-%d)"
          git push

      - name: 版本有变化时开 Issue 通知
        if: steps.guard.outputs.skip != 'true' && hashFiles('data/changes.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 标签可能尚未创建，--force 让这一步可重复执行
          gh label create "版本更新" --color D93F0B --force
          gh issue create \
            --title "$(head -1 data/changes.md)" \
            --body-file <(tail -n +2 data/changes.md) \
            --label "版本更新"
