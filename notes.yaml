# 人工维护的中文名与要点解读
#
# 抓取程序会自动获取：英文名、当前版本、也接受的版本、官网原文
# 这个文件只补充机器无法生成的内容：
#   cn   —— 中文表格名（必填，缺失时网页回退显示英文名）
#   note —— 中文要点解读，支持 **加粗**；留空则该行不显示「要点」区块
#   soon —— 手工标记「即将换版」。一般不需要写：官网公告里预告的新版会被
#           自动识别；只有官网没发公告、但你另有渠道得知时才用得上
#
# 新增表格时在这里补一条即可；只改这个文件不需要动任何代码。

I-485:
  cn: 调整身份申请（境内转绿卡）
  note: >-
    **09/18/26 新版无宽限期**。9 月 18 日之前只接受 01/20/25 与 09/04/26 两版；
    9 月 18 日当天及以后（以邮戳或电子提交日为准）旧版一律退件，只接受 09/18/26 版。
    另需注意：09/04/26 版受 Casa Inc. v. Trump 禁令影响，
    对该案认证集体成员暂缓实施。

I-693:
  cn: 移民体检与疫苗接种报告
  note: >-
    可用版本取决于**民事外科医生的签字日期**，而非提交日期：
    2025 年 7 月 2 日（含）之前签字，03/09/23 与 01/20/25 两版均可；
    7 月 3 日及以后签字，仅接受 01/20/25 版。

G-28:
  cn: 律师／授权代表出庭通知
  note: >-
    USCIS 表示新版**即将发布**。在此之前，09/17/18 与 05/23/18 两版仍可使用，
    表格上印的过期日期可忽略。新版发布后本页会自动提醒。

I-130:
  cn: 外籍亲属移民申请（含 I-130A）
  note: >-
    I-130A（配偶受益人补充信息表）没有独立的官网页面，与 I-130 同在一个页面，
    共用该页的 Edition Date 栏目。

I-131:
  cn: 旅行证件／回美证／人道假释申请



I-140:
  cn: 外籍劳工移民申请

I-129:
  cn: 非移民劳工申请（H-1B／L／O 等）
  note: >-
    **09/09/26 新版已生效，旧版 02/27/26 可用到 11 月 9 日之前**。以邮戳或电子提交日为准：
    11 月 9 日之前两版都收，11 月 9 日当天及以后旧版一律退件，只接受 09/09/26 版。
    官网这次没有用「宽限期」的措辞，但效果是两版并行 61 天。
    新版是配合 9-11 生物识别费终局规则（9 月 9 日生效）发布的；
    该费只对官网定义的「覆盖雇主」适用，判断标准见页面公告原文。


I-90:
  cn: 绿卡更换／补发申请

I-751:
  cn: 解除绿卡条件限制申请

N-400:
  cn: 入籍归化申请

I-821D:
  cn: DACA 童年入境者暂缓遣返

I-134:
  cn: 经济支持声明

I-765:
  cn: 工作许可（工卡）申请
  note: >-
    **09/15/26 新版无宽限期**。以邮戳或电子提交日为准：9 月 15 日之前提交，
    仍用 08/21/25 版；9 月 15 日当天及以后，旧版一律退件，只接受 09/15/26 版。
    官网已放出新版预览（见 Special Instructions）。

I-539:
  cn: 非移民身份延期／转换申请
  note: >-
    **09/15/26 新版无宽限期**。以邮戳或电子提交日为准：9 月 15 日之前提交，
    仍用 08/28/24 版；9 月 15 日当天及以后，旧版一律退件，只接受 09/15/26 版。
    官网已放出新版预览（见 Special Instructions）。

I-864:
  cn: 经济担保书
  note: >-
    **旧版 10/17/24 的宽限期到 9 月 30 日为止**，自 10/01/26 起只接受 08/24/26 版。
    附了旧版 I-864 不会导致 I-485 被退件，但会按「缺少初始证据」处理。
    另需提醒担保人：新版含征信授权条款，若其信用报告设有冻结，应尽早解除，
    否则 USCIS 无法核实经济能力，会拖慢审理。

