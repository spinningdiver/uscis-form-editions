I-864A:
  cn: 担保人与家庭成员合同
  note: >-
    **旧版 10/17/24 的宽限期到 9 月 30 日为止**，自 10/01/26 起只接受 08/24/26 版。
    附了旧版 I-864A 不会导致 I-485 被退件，但会按「缺少初始证据」处理。
    新版含征信授权条款，担保人若对信用报告设有冻结，应尽早解除。

I-360:
